spring:
  application:
    name: english-app

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
    out-of-order: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:dummy-openai-key}}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true



  security:
    oauth2:
      redirect-uri: ${SPRING_SECURITY_OAUTH2_REDIRECT_URI:${app.frontend-url}/oauth2/redirect}
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

jwt:
  issuer: ${JWT_ISSUER}
  # Đơn vị: GIÂY (seconds). VD: 3600 = 1 giờ, 86400 = 1 ngày
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
  # Đơn vị: GIÂY (seconds). VD: 604800 = 7 ngày
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

onboarding:
  placement:
    max-questions: 20
  roadmap:
    # Low-frequency crash recovery only. New and retryable jobs wake the worker via after-commit events.
    poll-ms: ${ONBOARDING_ROADMAP_POLL_MS:1800000}
    max-jobs-per-poll: ${ONBOARDING_ROADMAP_MAX_JOBS_PER_POLL:10}

adaptive:
  roadmap:
    ipa-max-per-module: ${ADAPTIVE_ROADMAP_IPA_MAX_PER_MODULE:12}
  learner:
    alpha: ${ADAPTIVE_LEARNER_ALPHA:0.2}
    placement-confidence: ${ADAPTIVE_LEARNER_PLACEMENT_CONFIDENCE:0.3}
    vocabulary-review-reliability: ${ADAPTIVE_LEARNER_VOCABULARY_RELIABILITY:0.3}
    pronunciation-reliability: ${ADAPTIVE_LEARNER_PRONUNCIATION_RELIABILITY:0.6}
    speaking-reliability: ${ADAPTIVE_LEARNER_SPEAKING_RELIABILITY:1.0}
  study-time:
    max-seconds-per-activity: ${ADAPTIVE_STUDY_TIME_MAX_SECONDS:900}
    vocabulary-reviewed-seconds: ${ADAPTIVE_STUDY_TIME_VOCABULARY_SECONDS:10}
    vocabulary-round-seconds: ${ADAPTIVE_STUDY_TIME_ROUND_SECONDS:180}
    pronunciation-seconds: ${ADAPTIVE_STUDY_TIME_PRONUNCIATION_SECONDS:60}
    speaking-seconds: ${ADAPTIVE_STUDY_TIME_SPEAKING_SECONDS:480}
  recommendation:
    rules-version: ${ADAPTIVE_RECOMMENDATION_RULES_VERSION:2026-10-06.1}
    default-budget-minutes: ${ADAPTIVE_RECOMMENDATION_DEFAULT_BUDGET_MINUTES:15}
    weak-phoneme-threshold: ${ADAPTIVE_RECOMMENDATION_WEAK_PHONEME_THRESHOLD:60}
    assignment-horizon-days: ${ADAPTIVE_RECOMMENDATION_ASSIGNMENT_HORIZON_DAYS:3}
    weights:
      due-urgency: ${ADAPTIVE_RECOMMENDATION_WEIGHT_DUE_URGENCY:0.35}
      weakness: ${ADAPTIVE_RECOMMENDATION_WEIGHT_WEAKNESS:0.25}
      roadmap: ${ADAPTIVE_RECOMMENDATION_WEIGHT_ROADMAP:0.20}
      goal: ${ADAPTIVE_RECOMMENDATION_WEIGHT_GOAL:0.10}
      freshness: ${ADAPTIVE_RECOMMENDATION_WEIGHT_FRESHNESS:0.10}
  worker:
    # Keep local/dev feedback fast; production can override this recovery interval.
    poll-ms: ${ADAPTIVE_WORKER_POLL_MS:5000}
    batch-size: ${ADAPTIVE_WORKER_BATCH_SIZE:50}
    max-attempts: ${ADAPTIVE_WORKER_MAX_ATTEMPTS:5}
    stuck-after-ms: ${ADAPTIVE_WORKER_STUCK_AFTER_MS:600000}
    max-backoff-seconds: ${ADAPTIVE_WORKER_MAX_BACKOFF_SECONDS:300}

account:
  deletion:
    # Access is disabled immediately. The durable purge starts after this grace period.
    grace-period-hours: ${ACCOUNT_DELETION_GRACE_PERIOD_HOURS:0}
    poll-ms: ${ACCOUNT_DELETION_POLL_MS:5000}
    max-jobs-per-poll: ${ACCOUNT_DELETION_MAX_JOBS_PER_POLL:10}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:https://english-app-backend-jq3h.onrender.com/api/v1/payments/vnpay-return}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  support-email: ${APP_SUPPORT_EMAIL:}
  cors:
    # Danh sách origin được phép gọi API. Thêm domain production vào đây.
    # VD: https://yourdomain.com,http://localhost:3000
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}

speaking:
  provider: ${SPEAKING_PROVIDER:gemini}
  worker:
    pool-size: ${SPEAKING_WORKER_POOL_SIZE:4}
    poll-ms: 1800000 # 30 phút
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${SPEAKING_OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${SPEAKING_OPENAI_MODEL:gpt-4}

elevenlabs:
  api-key: ${ELEVENLABS_API_KEY:}
  api-url: ${ELEVENLABS_API_URL:https://api.elevenlabs.io/v1/text-to-speech}
  default-voice-id: ${ELEVENLABS_DEFAULT_VOICE_ID:pNInz6obpgDQGcFmaJgB}

azure:
  speech:
    subscription-key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:japaneast}
    timeout-seconds: 10
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:english-app-media}
firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:firebase-adminsdk.json}

gamification:
  daily-mission:
    new-words-limit: 5
    review-words-limit: 15

notification:
  outbox:
    # Chu kỳ xử lý thông báo đang chờ (mili giây).
    poll-ms: ${NOTIFICATION_OUTBOX_POLL_MS:5000}
    max-events-per-poll: ${NOTIFICATION_OUTBOX_MAX_EVENTS_PER_POLL:50}

storage:
  cleanup:
    # Chu kỳ xử lý các job xóa file (mili giây).
    poll-ms: ${STORAGE_CLEANUP_POLL_MS:30000}
    max-jobs-per-poll: ${STORAGE_CLEANUP_MAX_JOBS_PER_POLL:25}
