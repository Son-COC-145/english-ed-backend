services:
  # ======================== PostgreSQL ========================
  postgres:
    image: postgres:15-alpine
    container_name: english_app_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: english_app_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ======================== Redis =============================
  redis:
    image: redis:7-alpine
    container_name: english_app_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ======================== pgAdmin (Xem Database) ============
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: english_app_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@english-app.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
